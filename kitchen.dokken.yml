---
driver:
  name: dokken
  privileged: true  # because Docker and SystemD/Upstart
  chef_version: <%= ENV['CHEF_VERSION'] || '18' %>

transport:
  name: dokken

provisioner:
  name: dokken
  product_name: cinc
  enforce_idempotency: true

platforms:
  - name: debian-12
    driver:
      image: dokken/debian-12
      pid_one_command: /usr/lib/systemd/systemd

  - name: debian-13
    driver:
      image: dokken/debian-13
      pid_one_command: /usr/lib/systmd/systemd

  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /usr/lib/systemd/systemd
